name: served-model
version: 1
contract:
  required_variables:
    - project_name
    - package_name
    - preset
  entrypoints:
    test: uv run pytest
    train: uv run python -m {{package_name}}.train
    serve: uv run serve
    predict: >-
      curl -X POST http://127.0.0.1:8000/predict
      -H "Content-Type: application/json"
      -d '{"features":{"feature_a":1.0,"feature_b":-0.25}}'
    build: uv build
    docker_build: docker build -t {{package_name}} .
  generated_paths:
    - .github/workflows/ci.yml
    - Dockerfile
    - README.md
    - configs/project.yaml
    - data/README.md
    - docs/infra-checklist.md
    - docs/runbook.md
    - ml-struct.yaml
    - orchestration/monitoring_job.py
    - pyproject.toml
    - tests/test_deployment.py
    - tests/test_evaluate.py
    - tests/test_scaffold.py
    - tests/test_training.py
    - "{{package_name}}/__init__.py"
    - "{{package_name}}/api.py"
    - "{{package_name}}/deployment.py"
    - "{{package_name}}/evaluate.py"
    - "{{package_name}}/predict.py"
    - "{{package_name}}/train.py"
