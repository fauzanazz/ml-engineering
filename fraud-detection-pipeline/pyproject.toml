[project]
name = "fraud-detection-pipeline"
version = "0.1.0"
description = "Leakage-safe end-to-end credit-card fraud training, evaluation, and inference pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3.0",
    "lightgbm>=4.0.0",
    "optuna>=4.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=3.2.0",
]

[project.scripts]
fraud-detect-train = "fraud_detection.cli:main"
fraud-detect-score = "fraud_detection.score_cli:main"
fraud-detect-report = "fraud_detection.reporting:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
