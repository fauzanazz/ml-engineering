[project]
name = "{{package_name}}"
version = "0.1.0"
description = "Deploy-agnostic ML model serving service template."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]

[project.scripts]
serve = "{{package_name}}.api:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["{{package_name}}"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
