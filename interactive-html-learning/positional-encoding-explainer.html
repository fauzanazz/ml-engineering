:root{--paper:#f7f3e8;--ink:#182225;--muted:#5d6869;--line:#c9c3b5;--blue:#176b87;--red:#a33a32;--green:#287449;--card:#fffdf6;--focus:#005fcc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Avenir Next","Trebuchet MS",sans-serif}button,input,select{font:inherit;color:inherit}button,.button{min-height:44px;border:1.5px solid var(--ink);background:var(--card);padding:.55rem .85rem;border-radius:5px;cursor:pointer;font-weight:650}button:hover:not(:disabled){background:#ebe6d8}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.mono,output,.metric,.vector-cell{font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}#app-header{position:relative;z-index:20;background:rgba(247,243,232,.97);border-bottom:2px solid var(--ink);padding:.7rem clamp(1rem,3vw,2rem)}.header-row,.toolbar,.controls,.nav-actions,.token-row,.model-grid{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}.header-row{justify-content:space-between}.brand{font-weight:850;letter-spacing:.02em}.progress-wrap{display:grid;grid-template-columns:auto minmax(100px,220px);gap:.6rem;align-items:center}.progress-track{height:9px;border:1px solid var(--ink);background:#fff}.progress-fill{height:100%;background:var(--green);width:0}.storage-status{font-size:.82rem;color:var(--red)}#lesson-nav{display:flex;gap:.35rem;overflow-x:auto;padding:.55rem 0 0;scrollbar-width:thin}#lesson-nav button{min-width:44px;padding:.35rem .65rem}.active-nav{background:var(--ink)!important;color:var(--paper)}main{max-width:1280px;margin:auto;padding:clamp(1rem,3vw,2.2rem);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:clamp(1.2rem,4vw,3rem);align-items:start}#visual-stage{position:sticky;top:155px;min-width:0;border:2px solid var(--ink);background:var(--card);padding:clamp(1rem,2.5vw,1.5rem);box-shadow:7px 7px 0 #d7d1c2}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;font-weight:800;color:var(--blue)}h1{font-size:clamp(1.55rem,3vw,2.4rem);line-height:1.15;margin:.25rem 0 .8rem}h2{font-size:1.3rem;margin:1.2rem 0 .45rem}h3{font-size:1.05rem}.lead{font-size:1.08rem}.note,.callout,.summary{border-left:4px solid var(--blue);padding:.7rem .9rem;background:#edf5f5}.callout{margin:.8rem 0;border-color:#d18d24;background:#fff4d8}.control-group{padding:.8rem 0;border-top:1px dashed var(--line)}.control-group[hidden]{display:none}.control-group.current-step{outline:2px solid #d18d24;outline-offset:5px}.visual-canvas{min-height:320px;padding:.8rem 0;overflow:hidden}.token{min-height:54px;padding:.7rem 1rem;border:2px solid var(--ink);background:#fff;display:grid;gap:.15rem;place-items:center;border-radius:4px;cursor:grab}.token.dragging{opacity:.5}.token .pos{color:var(--blue);font-size:.8rem}.token-actions{display:flex;gap:.25rem}.token-actions button{min-height:44px;padding:.25rem .55rem}.arrow{color:var(--blue);font-size:1.4rem}.vector{display:grid;grid-template-columns:80px repeat(8,minmax(36px,1fr));gap:4px;margin:.6rem 0;overflow-x:auto}.vector-label{font-weight:800;display:grid;place-items:center}.vector-cell{border:1px solid var(--line);padding:.5rem .25rem;text-align:center;background:color-mix(in srgb,var(--blue) calc((var(--mag) + 1)*14%),white)}.equation{font-weight:850;text-align:center;padding:.75rem;border:1px solid var(--line)}svg{display:block;width:100%;height:auto;max-height:320px}.axis{stroke:#8c8c83;stroke-width:1}.wave-a{fill:none;stroke:var(--blue);stroke-width:2}.wave-b{fill:none;stroke:var(--red);stroke-width:2}.marker{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}.heatmap{display:grid;grid-template-columns:38px repeat(8,1fr);gap:2px;font-size:.68rem}.heat-cell{min-height:12px;background:hsl(calc(190 + 35*var(--v)),55%,calc(72% - 24%*var(--v)));border:1px solid rgba(0,0,0,.07)}.heat-head{text-align:center}.relative-line{position:relative;height:110px;border-bottom:2px solid var(--ink);margin:1rem 1.2rem}.pin{position:absolute;bottom:-13px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--blue);border:3px solid var(--card);box-shadow:0 0 0 1px var(--ink)}.pin.b{background:var(--red)}.pin-label{position:absolute;bottom:24px;transform:translateX(-50%);white-space:nowrap}.q{color:var(--blue)}.k{color:var(--red)}.v{color:var(--green)}.attention-row{display:grid;grid-template-columns:120px 1fr;gap:.6rem;align-items:center;margin:.35rem 0}.attention-bar{height:12px;background:var(--red);transform-origin:left}.model-grid{align-items:stretch}.model-card{flex:1 1 220px;text-align:left;padding:1rem;border:2px solid var(--line);background:#fff}.model-card.selected{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}.context-strip{display:flex;gap:3px;height:84px;align-items:end}.context-token{flex:1;min-width:2px;background:#c9c3b5}.context-token.fact{background:var(--green);height:100%}.context-token.question{background:var(--blue);height:100%}.context-token.distractor{height:45%}#checkpoint{border-top:2px solid var(--ink);margin-top:2rem;padding-top:1rem}fieldset{border:0;padding:0;margin:0}.option{display:flex;gap:.65rem;align-items:flex-start;padding:.55rem 0}.option input{width:20px;height:20px;flex:none}.feedback{min-height:2.4rem;font-weight:750}.correct{color:var(--green)}.incorrect{color:var(--red)}.nav-actions{justify-content:space-between;margin-top:1.5rem}dialog{border:0;padding:0;background:transparent;width:min(760px,95vw);height:100dvh;max-height:none;margin:0 0 0 auto}dialog::backdrop{background:rgba(12,18,19,.55)}.drawer{height:100%;background:var(--paper);border-left:2px solid var(--ink);padding:1rem;overflow:auto}.drawer-head{position:sticky;top:-1rem;background:var(--paper);z-index:2;padding:1rem 0;border-bottom:1px solid var(--line)}.drawer-head .header-row{align-items:flex-start}.transcript-item{border-bottom:1px solid var(--line);padding:.5rem 0}.transcript-item summary{cursor:pointer;min-height:44px;padding:.6rem;font-weight:800}.role-user{color:var(--blue)}.role-assistant{color:var(--green)}.role-tool{color:var(--red)}.message{padding:.4rem .8rem 1rem;white-space:normal;overflow-wrap:anywhere}.message pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e8e3d7;padding:.8rem}.message code{background:#e8e3d7;padding:.1rem .25rem}.message blockquote{border-left:3px solid var(--line);margin:.6rem 0;padding-left:.8rem}mark{background:#ffd85c}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){#app-header{position:relative}.progress-wrap{grid-template-columns:1fr;width:100%}main{grid-template-columns:1fr;padding:1rem}#visual-stage{position:relative;top:auto;box-shadow:4px 4px 0 #d7d1c2}.visual-canvas{min-height:260px}.vector{grid-template-columns:65px repeat(8,48px)}dialog{width:100vw}.drawer{border-left:0}.header-row{align-items:flex-start;width:100%;min-width:0}#app-header .toolbar{display:grid;grid-template-columns:1fr 1fr;width:100%;min-width:0}#app-header .toolbar label{grid-column:1/-1}#app-header .toolbar select{max-width:100%}#visual-stage,#lesson-copy{width:100%;min-width:0}.token-row{flex-direction:column;align-items:stretch}.token-row .arrow{align-self:center;transform:rotate(90deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style></head>

<script>
const TRANSCRIPT = [{"id":"3f7232b4-c463-4e39-9a1d-3916cd076620","role":"user","content":"Bagaimana vector positional encoding dibuat?"},{"id":"1fc36f1e-a04b-4d5a-8c10-21cf2925f2ca","role":"tool","content":"The output of this plugin was redacted."},{"id":"6f80c44d-d815-43a6-a423-36a70063281c","role":"tool","content":"The output of this plugin was redacted."},{"id":"1d686613-effd-48c9-a632-dc4f68d15b7e","role":"tool","content":"The output of this plugin was redacted."},{"id":"dbd0bb55-18e9-40aa-9d2e-749638cfacc5","role":"assistant","content":"Bagus, sebelum masuk ke Transformer modern, saya ingin cek dulu pemahamanmu.\n\nKetika kita mengubah kalimat menjadi embedding kata, misalnya:\n\n> \"Saya makan nasi\"\n\nmenjadi:\n\n- Saya → v₁\n- makan → v₂\n- nasi → v₃\n\nMenurutmu, kalau model hanya melihat ketiga vektor itu tanpa informasi tambahan, apakah model bisa membedakan:\n\n> \"Saya makan nasi\"\n\ndan\n\n> \"Nasi makan saya\"\n\n?\n\nCoba jawab dulu. Ini inti alasan kenapa positional encoding dibutuhkan."},{"id":"1fde1911-4fad-45d2-a11b-9713552a81d9","role":"user","content":"Tidak bisa, karena hanya vector angka saja tanpa ada informasi posisi"},{"id":"f7c74d06-3614-4b72-a43a-95b9c5744495","role":"assistant","content":"Tepat sekali.\n\nEmbedding hanya merepresentasikan **makna token**, bukan **urutan token**. Jadi tanpa informasi posisi, self-attention akan menganggap kumpulan token sebagai semacam \"bag of embeddings\".\n\nSekarang pertanyaan berikutnya:\n\nKalau kita ingin memberi tahu model bahwa:\n\n- \"Saya\" berada di posisi 0\n- \"makan\" berada di posisi 1\n- \"nasi\" berada di posisi 2\n\nMenurutmu lebih masuk akal:\n\nA. Menambahkan angka posisi langsung ke embedding (misal posisi 0,1,2)\n\natau\n\nB. Membuat sebuah **vektor posisi** yang ukurannya sama dengan embedding lalu dijumlahkan dengan embedding token\n\nMana yang menurutmu lebih cocok untuk neural network? Dan kenapa?"},{"id":"4d59ae2b-bb19-4616-8ac5-d3a8a4aeba29","role":"user","content":"B? Karena dengan begitu dimensi input nya tetap sama"},{"id":"5a0c7363-a090-4dee-8136-59a4a4f3310e","role":"assistant","content":"Ya, itu alasan yang sangat penting.\n\nKalau embedding token ukurannya 512 dimensi, lalu positional encoding juga 512 dimensi, maka:\n\n\\[\nx_{final} = x_{token} + x_{position}\n\\]\n\ndimensi tetap 512 sehingga seluruh layer berikutnya tidak perlu diubah.\n\nSekarang pertanyaan berikutnya:\n\nMenurutmu vektor posisi untuk posisi ke-0, ke-1, ke-2, dst dibuat bagaimana?\n\nAda dua kemungkinan besar:\n\n1. Diisi angka yang dipelajari model (learnable parameters).\n2. Dibuat dengan rumus matematika tertentu.\n\nMenurutmu kenapa paper Transformer asli memilih opsi kedua (rumus matematika), bukan langsung membuat tabel parameter posisi yang dipelajari? Coba tebak dulu alasannya."},{"id":"f7b1c127-01c0-41e0-8fa1-07c35b387fca","role":"user","content":"Agar efisien? Tidak perlu ada train ulang untuk positional encoding karena tokenizer sudah learnable model"},{"id":"60dc3ade-c48f-4108-8a04-2b4450b26482","role":"assistant","content":"Benar, itu salah satu keuntungan besar.\n\nKalau positional encoding dibuat dari rumus:\n\n- tidak perlu parameter tambahan untuk setiap posisi,\n- tidak perlu dilatih,\n- jumlah parameter model lebih kecil,\n- bisa langsung digunakan untuk sequence yang lebih panjang daripada yang pernah dilihat saat training.\n\nNah, alasan terakhir ini yang paling menarik.\n\nBayangkan kalau kita menyimpan tabel posisi:\n\n| Posisi | Vector |\n|---------|---------|\n| 0 | learned |\n| 1 | learned |\n| 2 | learned |\n| ... | ... |\n| 1023 | learned |\n\nLalu saat inference tiba-tiba ada token di posisi 1500.\n\nMenurutmu apa masalahnya? Model belum punya vektor posisi 1500 karena saat training hanya sampai 1023.\n\n---\n\nKarena itu paper Transformer menggunakan rumus sinus dan cosinus:\n\ngenui{\"math_block_widget_always_prefetch_v2\":{\"content\":\"PE(pos,2i)=\\\\sin\\\\left(\\\\frac{pos}{10000^{2i/d_{model}}}\\\\right),\\\\quad PE(pos,2i+1)=\\\\cos\\\\left(\\\\frac{pos}{10000^{2i/d_{model}}}\\\\right)\"}}\n\nAku tidak akan langsung menjelaskan rumusnya dulu.\n\nCoba fokus ke ide ini:\n\nJika dimensi pertama berosilasi cepat, dimensi berikutnya lebih lambat, berikutnya lebih lambat lagi, dan seterusnya, menurutmu apa keuntungan memiliki banyak gelombang sinus dengan frekuensi berbeda-beda untuk merepresentasikan posisi?"},{"id":"aa10f974-8419-45a4-ab07-8ea1e80789e2","role":"user","content":"Apakah dengan begitu terbuat angka2 berbeda yang berdekatan untuk posisi yang berdekatan dan jauh untuk posisi yang berjauhan?"},{"id":"0d4573d1-9213-4709-bcbf-57983ad2ecee","role":"assistant","content":"Ya, kamu sudah mengarah ke salah satu sifat pentingnya.\n\nKarena sinus dan cosinus **kontinu dan smooth**, maka:\n\n- posisi 100 dan 101 menghasilkan vektor yang mirip,\n- posisi 100 dan 500 menghasilkan vektor yang lebih berbeda.\n\nJadi model bisa menangkap konsep **kedekatan posisi**.\n\nTapi ada alasan yang lebih dalam lagi.\n\nBayangkan hanya memakai satu sinus:\n\n\\[\n\\sin(pos)\n\\]\n\nMasalahnya, nilai sinus akan berulang:\n\n- posisi 0 → 0\n- posisi \\(2\\pi\\) → 0\n- posisi \\(4\\pi\\) → 0\n\nArtinya beberapa posisi berbeda bisa terlihat sama.\n\nNah Transformer mengatasi ini dengan menggabungkan **banyak sinus dan cosinus dengan frekuensi berbeda-beda**. Akibatnya setiap posisi memiliki semacam \"sidik jari\" unik.\n\nMirip seperti jam:\n\n- jarum detik,\n- jarum menit,\n- jarum jam.\n\nSatu jarum saja sering ambigu. Tapi kombinasi ketiganya hampir selalu menunjukkan waktu yang unik.\n\nPertanyaan berikutnya:\n\nMisalkan ada dua posisi:\n\n- pos = 100\n- pos = 101\n\nMenurutmu lebih berguna bagi attention untuk mengetahui:\n\n1. Posisi absolutnya (100 dan 101)\n2. Bahwa jaraknya hanya 1 token\n\nMana yang sebenarnya lebih penting untuk memahami bahasa? Coba pikirkan kasus seperti:\n\n> \"tidak bagus\"\n\nvs\n\n> \"tidak terlalu bagus\"\n\ndi mana hubungan antar kata sangat dipengaruhi oleh jarak relatifnya."},{"id":"48eed60c-ddd7-4d2d-a18a-76e06ca7ba08","role":"user","content":"2 bahwa jaraknya hanya satu token"},{"id":"88310290-55d1-4b9b-8c01-ff3b8b2d1ac5","role":"assistant","content":"Tepat.\n\nDan ini sebenarnya salah satu alasan mengapa sinusoidal positional encoding cukup cerdas.\n\nSelf-attention sering lebih peduli pada:\n\n- kata sebelumnya,\n- kata sesudahnya,\n- token yang berjarak 2–5 posisi,\n- hubungan lokal lainnya,\n\ndaripada nomor posisi absolut seperti \"ini token ke-847\".\n\nYang menarik, dari sifat sinus/cosinus tadi, model bisa belajar hubungan relatif.\n\nMisalnya secara sederhana:\n\n- posisi 100 → vektor A\n- posisi 101 → vektor B\n\nPerbedaan \\(B-A\\) akan memiliki pola yang konsisten dengan \"geser satu langkah\".\n\nKarena sinus dan cosinus memiliki identitas trigonometri yang teratur, attention dapat belajar mendeteksi:\n\n- jarak 1 token,\n- jarak 2 token,\n- jarak 10 token,\n\ntanpa perlu diberi fitur \"distance\" secara eksplisit.\n\nMakanya pada paper Transformer asli, penulis bahkan menulis bahwa mereka berharap model dapat dengan mudah belajar menghadapi **relative positions**, bukan hanya absolute positions.\n\n---\n\nSekarang saya ingin menghubungkan ke LLM modern.\n\nTransformer asli memakai sinusoidal encoding ini, tetapi banyak model modern seperti:\n\n- entity[\"company\",\"Meta\",\"Llama models\"] Llama\n- entity[\"company\",\"OpenAI\",\"GPT family\"] GPT modern\n- entity[\"company\",\"Google\",\"Gemma models\"] Gemma\n\nsudah beralih ke teknik seperti **RoPE (Rotary Positional Embedding)**.\n\nMenurutmu, kalau masalah utama positional encoding adalah membantu model memahami **jarak relatif antar token**, apakah lebih baik:\n\nA. Menambahkan informasi posisi ke embedding di awal saja.\n\natau\n\nB. Memasukkan informasi posisi langsung ke perhitungan attention sehingga query dan key \"tahu\" posisi relatif satu sama lain.\n\nMana yang menurutmu terdengar lebih kuat? Dan kenapa?"},{"id":"9f4bb13a-3001-4946-8f81-de4fe806dfa5","role":"user","content":"yang B karena memasukkan informasi posisi membuat posisi kalimat menjadi lebih dari kata yg beda satu token tapi juga kata ini berkaitan erat"},{"id":"e84d9d71-91c6-49fd-b07e-78a5f831178f","role":"assistant","content":"Ya, arah berpikirmu benar.\n\nPada positional encoding klasik:\n\n\\[\nembedding = token + posisi\n\\]\n\ninformasi posisi dicampur ke embedding sekali di awal. Setelah itu attention harus \"menebak\" sendiri hubungan posisi dari representasi tersebut.\n\nSedangkan pada RoPE, informasi posisi masuk langsung ke mekanisme yang menentukan **siapa memperhatikan siapa**, yaitu Query dan Key.\n\nSecara konseptual:\n\n- Transformer klasik: \"ini kata A di posisi 100, ini kata B di posisi 101\"\n- RoPE: \"kata A dan kata B berjarak 1 token\"\n\nHubungan relatif menjadi lebih eksplisit.\n\n---\n\nBayangkan kalimat:\n\n> \"Saya tidak suka film itu\"\n\nKetika attention melihat kata **\"tidak\"** dan **\"suka\"**, yang penting bukan:\n\n- \"tidak ada di posisi 2\"\n- \"suka ada di posisi 3\"\n\nmelainkan:\n\n- \"tidak berada tepat sebelum suka\"\n\nHubungan relatif inilah yang sangat penting untuk memahami makna.\n\n---\n\nAda satu masalah lain yang diselesaikan RoPE.\n\nIngat tadi kita bahas sinusoidal encoding dipilih karena bisa melakukan **extrapolation** ke posisi yang lebih panjang daripada saat training?\n\nMenurutmu kalau model dilatih pada context window 2.000 token lalu saat inference diberi 8.000 token:\n\n- learned positional embedding\n- sinusoidal encoding\n- RoPE\n\nmana yang kira-kira paling bermasalah dan kenapa?\n\nCoba analisis satu per satu dulu. Jangan khawatir kalau belum yakin, kita bedah bersama."},{"id":"62d35869-444c-4939-88d2-d019d64505da","role":"user","content":"Jika token melebihi yang dilatih, maka\n1. pada learned positional embedding, Model positional embedder jatuh karena melihat data baru yang tidak pernah dilatih\n2. pada sinusoidal encoding, Embeddernya aman tapi model GPTnya yang tidak mengerti akan data baru\n3. pada RoPE, hal ini relatif lebih aman"},{"id":"5f2492ff-a856-461e-9ff6-c3c790ab12ec","role":"assistant","content":"Bagus. Analisismu sudah cukup dekat dengan yang terjadi di praktik.\n\nMari kita bedah satu per satu.\n\n### 1. Learned Positional Embedding\n\nIni yang paling jelas bermasalah.\n\nKalau saat training hanya ada posisi:\n\n- 0 ... 2047\n\nmaka tabel positional embedding hanya punya 2048 baris.\n\nSaat tiba-tiba muncul posisi 5000:\n\n> \"vektor posisi 5000 itu apa?\"\n\nTidak ada jawabannya.\n\nKarena itu model seperti GPT-2 lama biasanya punya **hard context limit**. Di luar itu memang tidak ada positional embedding yang valid.\n\n---\n\n### 2. Sinusoidal Encoding\n\nKamu bilang:\n\n> embeddernya aman tapi model GPTnya yang tidak mengerti data baru\n\nIni observasi yang bagus.\n\nRumus sinusoidal bisa menghasilkan posisi berapa pun:\n\n- 1000\n- 10000\n- 100000\n\nsemua bisa dihitung.\n\nJadi **encoding-nya tidak pernah kehabisan posisi**.\n\nMasalahnya:\n\nModel dilatih melihat pola attention pada panjang tertentu, misalnya sampai 2048 token.\n\nKalau tiba-tiba diberi 32000 token:\n\n- positional encoding masih valid,\n- tetapi bobot attention belum pernah belajar dependency sejauh itu.\n\nJadi ada gap antara:\n\n> \"bisa merepresentasikan posisi\"\n\ndan\n\n> \"bisa memanfaatkan posisi tersebut dengan baik\"\n\n---\n\n### 3. RoPE\n\nIni yang menarik.\n\nRoPE juga menggunakan ide sinus/cosinus, tetapi bukan dijumlahkan ke embedding.\n\nRoPE melakukan rotasi pada Query dan Key berdasarkan posisi.\n\nAkibatnya similarity attention menjadi fungsi dari:\n\n\\[\n\\text{jarak relatif}\n\\]\n\nbukan hanya posisi absolut.\n\nKarena itu ketika context diperpanjang:\n\n- pola \"jarak 1 token\"\n- pola \"jarak 10 token\"\n- pola \"jarak 100 token\"\n\nmasih relatif konsisten.\n\nMakanya RoPE jauh lebih baik untuk context extension dibanding learned positional embedding.\n\n---\n\nSekarang ada satu insight penting yang sering muncul saat interview LLM serving.\n\nBayangkan model dilatih dengan context:\n\n- 4K token\n\nlalu vendor mengklaim:\n\n- 128K token context\n\nPertanyaannya:\n\n> Apakah berarti model benar-benar bisa menggunakan informasi di token ke-120.000 dengan kualitas yang sama seperti token ke-100?\n\nMenurutmu jawabannya apa?\n\nPetunjuk: bedakan antara:\n\n1. **model bisa menerima token tersebut**\n2. **model bisa mengingat dan menggunakan informasi tersebut secara efektif**\n\nDua hal ini sering disamakan padahal berbeda."},{"id":"f8b0f55b-1bce-41f7-91a3-2a9ad64c9457","role":"user","content":"Model bisa menerima tapi model tidak akan bisa mengingat dan menggunakan informasi tersebut secara efektif, mungkin provider melakukan window switching dan hanya mengambil 2K token awal dan 2K token akhir"},{"id":"4b6bcfcb-b851-4410-a958-9e73ae7f0b08","role":"assistant","content":"Bagus. Kamu menyentuh dua hal yang berbeda:\n\n1. **Keterbatasan model**\n2. **Teknik engineering saat serving**\n\nMari kita pisahkan.\n\n### Tentang modelnya\n\nKalau model dilatih di 4K context lalu dipaksa membaca 128K token, masalah utamanya bukan sekadar posisi bisa direpresentasikan.\n\nMasalahnya:\n\n> Apakah selama training model pernah belajar dependency sejauh 100.000 token?\n\nBiasanya tidak.\n\nJadi walaupun RoPE memungkinkan posisi 120.000 direpresentasikan, kualitas reasoning terhadap token yang sangat jauh sering menurun.\n\nIni dikenal sebagai fenomena **effective context length**.\n\nMisalnya vendor bilang:\n\n- Context window = 128K\n\nBelum tentu berarti:\n\n- informasi di token #127.000 dipakai sebaik informasi di token #500.\n\n---\n\n### Tentang window switching\n\nYang kamu sebut juga memang ada di dunia nyata.\n\nBeberapa sistem melakukan:\n\n- truncation (potong bagian tengah)\n- sliding window\n- retrieval\n- context compression\n- summarization\n\nagar tidak perlu mengirim seluruh konteks ke model.\n\nMisalnya:\n\n```text\n[Awal dokumen]\n...\n[100 ribu token]\n...\n[Akhir dokumen]\n```\n\nSistem bisa memilih:\n\n```text\n2K token awal\n+\ninformasi yang diretrieve\n+\n2K token terakhir\n```\n\ndaripada mengirim semua 100 ribu token.\n\nTapi itu teknik aplikasi/serving, bukan kemampuan intrinsik model.\n\n---\n\nSekarang saya ingin menghubungkan semua yang kita bahas.\n\nUrutkan evolusi ini dengan kata-katamu sendiri:\n\n1. Mengapa Transformer membutuhkan positional information?\n2. Mengapa sinusoidal encoding lebih baik daripada learned positional embedding untuk generalisasi?\n3. Mengapa RoPE dianggap lebih baik daripada positional encoding klasik?\n\nCoba jawab singkat saja, 1–2 kalimat per poin. Ini latihan yang sering muncul saat interview ML/LLM engineer."},{"id":"67ae6cba-d538-4b18-9bef-94e269afffd2","role":"user","content":"1. Karena transformer berjalan secara paralell dan perlu ada informasi posisi dari setiap token, tidak seperti RNN yang melakukan generasi secara sequentials sehingga ada informasi posisi\n2. Karena learned mempunyai batas token, selagi sinusoidal tidak\n3. RoPE tidak memberikan informasi sesimple posisi, RoPE memberikan informasi bahwa kata A dekat hubungannya sama kata B"},{"id":"a0d113b3-87c1-40b1-8e6b-7f61215c2e13","role":"assistant","content":"Jawabanmu sudah cukup bagus. Saya hanya akan menyempurnakan sedikit supaya lebih akurat untuk level interview.\n\n### 1. Mengapa Transformer membutuhkan positional information?\n\nJawabanmu:\n\n> Karena transformer berjalan secara paralel dan perlu ada informasi posisi dari setiap token, tidak seperti RNN yang melakukan generasi secara sequential sehingga ada informasi posisi.\n\n✔️ Benar.\n\nVersi yang lebih lengkap:\n\n> Self-attention melihat semua token secara bersamaan sehingga urutan token hilang. Positional information diperlukan agar model dapat membedakan \"anjing menggigit manusia\" dan \"manusia menggigit anjing\".\n\n---\n\n### 2. Mengapa sinusoidal encoding lebih baik daripada learned positional embedding untuk generalisasi?\n\nJawabanmu:\n\n> Karena learned mempunyai batas token, selagi sinusoidal tidak.\n\n✔️ Benar.\n\nTambahan penting:\n\n> Sinusoidal encoding dapat menghasilkan representasi untuk posisi yang belum pernah muncul saat training karena posisinya dihitung dari rumus, bukan lookup table yang terbatas.\n\nJadi bukan hanya \"batas token\", tapi juga **kemampuan extrapolation ke posisi baru**.\n\n---\n\n### 3. Mengapa RoPE dianggap lebih baik daripada positional encoding klasik?\n\nJawabanmu:\n\n> RoPE tidak memberikan informasi sesimple posisi, RoPE memberikan informasi bahwa kata A dekat hubungannya sama kata B.\n\n✔️ Ini sudah menangkap inti terpentingnya.\n\nVersi interview yang lebih kuat:\n\n> RoPE memasukkan informasi posisi langsung ke mekanisme attention sehingga attention score bergantung pada posisi relatif antar token. Akibatnya model lebih mudah memahami hubungan jarak antar kata dan lebih stabil saat context window diperpanjang.\n\n---\n\nKalau saya ringkas seluruh perjalanan kita:\n\n```text\nRNN\n↓\nUrutan sudah implicit dalam state\n\nTransformer\n↓\nUrutan hilang karena parallel processing\n\nPositional Encoding\n↓\nMenambahkan informasi posisi absolut\n\nSinusoidal Encoding\n↓\nPosisi absolut + bisa extrapolate ke posisi baru\n\nRoPE\n↓\nPosisi relatif masuk langsung ke attention\n↓\nLebih baik untuk long context\n```\n\nPertanyaan terakhir untuk menguji pemahaman mendalam:\n\nKalau RoPE bekerja dengan **rotasi Query dan Key berdasarkan posisi**, menurutmu kenapa **Value (V)** tidak ikut dirotasi?\n\nIni pertanyaan yang sering membuat orang yang hanya menghafal RoPE jadi bingung. Coba pikirkan dulu fungsi Q, K, dan V dalam attention."},{"id":"01ce08a0-dbc4-4cee-8eee-a9e7a755696c","role":"user","content":"Jelaskan kepada ku fungsi Q, K, dan V dalam attention terlebih dahulu"},{"id":"1e5d4746-1291-4bfe-b6f5-034d963f6603","role":"assistant","content":"Bagus, sebelum masuk ke \"kenapa V tidak dirotasi\", kita harus benar-benar paham peran Q, K, dan V.\n\nSaya mau mulai dari analogi dulu.\n\nBayangkan kamu sedang mencari informasi di perpustakaan.\n\nSetiap buku memiliki:\n\n- label pencarian\n- isi buku\n\nDalam attention:\n\n- **Key (K)** = label buku\n- **Value (V)** = isi buku\n- **Query (Q)** = apa yang sedang kamu cari\n\nProsesnya:\n\n1. Query dibandingkan dengan semua Key.\n2. Semakin cocok Query dan Key, semakin besar skor attention.\n3. Skor tersebut dipakai untuk mengambil dan mencampurkan Value.\n\n---\n\nContoh kalimat:\n\n> \"Kucing makan ikan\"\n\nMisalkan kita sedang menghitung representasi token **\"makan\"**.\n\nSecara sederhana:\n\n```text\nQ(makan)\n   ↓ dibandingkan\nK(kucing)\nK(makan)\nK(ikan)\n\n→ menghasilkan skor attention\n```\n\nMisalnya hasilnya:\n\n```text\nkucing : 0.4\nmakan  : 0.1\nikan   : 0.5\n```\n\nLalu skor itu digunakan untuk menggabungkan Value:\n\n```text\n0.4 * V(kucing)\n+\n0.1 * V(makan)\n+\n0.5 * V(ikan)\n```\n\nHasil campuran itulah output attention untuk token \"makan\".\n\n---\n\nSekarang saya ingin memastikan konsepnya benar-benar masuk.\n\nDalam proses di atas:\n\n- Q dipakai untuk apa?\n- K dipakai untuk apa?\n- V dipakai untuk apa?\n\nCoba jelaskan masing-masing dalam satu kalimat singkat dengan kata-katamu sendiri. Setelah itu kita baru bahas kenapa RoPE hanya memutar Q dan K tetapi tidak V."},{"id":"9b0c6741-527d-4002-9d47-6782f732abbe","role":"user","content":"Query itu merepresentasikan input kita, Key adalah attention dari token lain, Value adalah embedding dari kata token tersebut"},{"id":"db6cfc62-e6f8-4034-b1d7-0862bb382d89","role":"assistant","content":"Sudah cukup dekat, tapi ada satu bagian yang perlu diluruskan.\n\nCoba lihat seperti ini:\n\n### Query (Q)\n\nBukan merepresentasikan input secara umum, melainkan:\n\n> \"Informasi apa yang sedang dicari token ini?\"\n\nSaat token **\"makan\"** diproses, Q(makan) adalah pertanyaan yang dibawa token \"makan\" ke seluruh kalimat.\n\n---\n\n### Key (K)\n\nBukan attention itu sendiri.\n\nLebih tepatnya:\n\n> \"Informasi apa yang ditawarkan token ini?\"\n\nSetiap token memasang semacam label atau alamat yang nanti dicocokkan dengan Query.\n\n---\n\n### Value (V)\n\nIni yang paling dekat dengan jawabanmu.\n\n> \"Informasi yang akan diberikan jika token ini diperhatikan.\"\n\nJadi setelah Q menemukan K yang cocok, yang diambil sebenarnya adalah V.\n\n---\n\nAnalogi database:\n\n| Komponen | Analogi |\n|-----------|----------|\n| Query | Kata kunci pencarian |\n| Key | Index database |\n| Value | Data yang disimpan |\n\n---\n\nSekarang saya mau cek pemahamanmu dengan satu pertanyaan.\n\nMisalkan token **\"makan\"** memiliki attention tinggi ke token **\"ikan\"**.\n\nMenurutmu yang digunakan untuk menentukan bahwa \"ikan\" relevan adalah:\n\n- kemiripan antara Q dan V?\n- kemiripan antara Q dan K?\n\nPilih salah satu dan jelaskan alasannya. Setelah itu kita bisa menjawab sendiri kenapa RoPE memutar Q dan K tetapi tidak V."},{"id":"15b4c68e-c9ed-4414-86c8-3f9b98d7c61b","role":"user","content":"Kemiripan antara Q dan V, karena didapatkan hasil K * Q tinggi dengan V"},{"id":"e9f1ead3-d30a-4464-92c6-0c701863aca8","role":"assistant","content":"Hampir benar, tapi ada satu detail penting yang sering membuat orang bingung.\n\nUrutannya sebenarnya:\n\n1. Hitung kemiripan **Q dengan K**.\n2. Dari kemiripan itu diperoleh attention score.\n3. Attention score digunakan untuk memberi bobot pada **V**.\n\nSecara sederhana:\n\n\\[\n\\text{Attention}(Q,K,V)\n=\n\\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d}}\\right)V\n\\]\n\nPerhatikan bahwa:\n\n```text\nQ × K\n↓\nattention weights\n↓\ndigunakan untuk mencampur V\n```\n\nJadi yang menentukan apakah token \"ikan\" relevan adalah:\n\n✅ **kemiripan antara Q dan K**\n\nbukan kemiripan antara Q dan V.\n\n---\n\nSekarang coba pikirkan tentang RoPE.\n\nRoPE ingin memasukkan informasi posisi.\n\nPosisi memengaruhi pertanyaan:\n\n> \"Saya mencari token yang dekat dengan saya\"\n\ndan juga memengaruhi label:\n\n> \"Saya berada di posisi sekian\"\n\nItu berarti posisi berpengaruh pada proses **matching** antara Query dan Key.\n\nTetapi Value bukan dipakai untuk matching. Value adalah informasi yang akan diambil **setelah** matching selesai.\n\nPertanyaan:\n\nKalau tujuan RoPE adalah membuat attention score mengetahui hubungan posisi relatif, menurutmu komponen mana yang perlu diberi informasi posisi?\n\n- Q saja?\n- K saja?\n- Q dan K?\n- V juga?\n\nPilih satu dan jelaskan alasannya dengan melihat alur perhitungan attention di atas. Jangan khawatir kalau belum tepat, kita selangkah lagi sampai memahami kenapa V tidak diputar."},{"id":"d54bbf21-7c03-4293-ad8e-ca89866cb179","role":"user","content":"Q dan K karena kedua itu yg di compare untuk menentukan kemiripan terhadap V"},{"id":"47c4d239-0805-433a-88dd-ce568e3db002","role":"assistant","content":"Ya, sekarang kamu sudah sangat dekat dengan jawabannya.\n\nAda satu kalimat yang perlu diperbaiki sedikit:\n\n> Q dan K karena kedua itu yg di compare untuk menentukan kemiripan terhadap V\n\nLebih tepatnya:\n\n> Q dan K dibandingkan untuk menentukan attention score, lalu attention score tersebut digunakan untuk mengambil dan menggabungkan V.\n\nKarena sebenarnya V tidak ikut dalam proses pencocokan.\n\nUrutannya:\n\n```text\nQ × K\n↓\nAttention Score\n↓\nAttention Weight\n↓\nWeight × V\n```\n\nJadi kalau RoPE ingin membuat attention memahami bahwa:\n\n- token A berjarak 1 dari token B\n- token C berjarak 100 dari token D\n\nmaka informasi posisi harus memengaruhi bagian yang menghitung:\n\n\\[\nQK^T\n\\]\n\nyaitu **Q dan K**.\n\n---\n\nSekarang coba pikirkan konsekuensinya.\n\nMisalnya kita juga memutar V.\n\nRoPE sudah membuat attention score tahu bahwa:\n\n```text\n\"tidak\" dekat dengan \"bagus\"\n```\n\nmelalui rotasi pada Q dan K.\n\nSetelah attention berhasil menemukan token yang relevan, menurutmu apakah isi informasi yang dibawa oleh Value perlu diubah lagi oleh posisi?\n\nAtau cukup posisi memengaruhi **siapa yang dipilih**, sedangkan Value tetap membawa makna semantiknya?\n\nContoh:\n\n```text\ntidak bagus\n```\n\nApakah kata \"bagus\" tetap harus membawa makna \"bagus\" pada V, atau V juga perlu diputar karena posisinya? Coba analisis sendiri. Ini langkah terakhir untuk memahami kenapa RoPE hanya bekerja pada Q dan K."},{"id":"221e9a87-84c4-4475-bbdb-87bc5414052d","role":"user","content":"iya harus tetap membawa makna bagus pada V makanya V tidak perlu diputar. Yang dibutuhkan hanya Q dan K"},{"id":"687a3428-dd0b-4d2f-8e9a-826c27615cfe","role":"assistant","content":"Tepat sekali. Sekarang kamu sudah sampai ke intuisi yang benar.\n\nKalau saya ringkas dengan bahasa interview:\n\n> RoPE diterapkan pada Query dan Key karena positional information dibutuhkan saat menghitung attention score. Value tidak perlu dirotasi karena Value membawa konten semantik yang akan diambil setelah proses matching selesai.\n\nAtau lebih teknis:\n\n```text\nQ dan K → menentukan \"siapa yang relevan\"\nV       → menentukan \"informasi apa yang diambil\"\n```\n\nPosisi memengaruhi **relevansi**, bukan **isi informasi**.\n\n---\n\nKalau V juga diputar, yang terjadi justru aneh.\n\nMisalnya token:\n\n```text\nbagus\n```\n\ndi posisi 10 dan posisi 100.\n\nMakna kata \"bagus\" seharusnya tetap sama.\n\nYang berubah adalah:\n\n- siapa yang memperhatikan \"bagus\"\n- seberapa kuat attention ke \"bagus\"\n\nbukan representasi semantik \"bagus\" itu sendiri.\n\nKarena itu RoPE cukup memodifikasi:\n\n\\[\nQ \\rightarrow Q'\n\\]\n\n\\[\nK \\rightarrow K'\n\\]\n\nlalu attention dihitung menggunakan:\n\n\\[\nQ'K'^T\n\\]\n\nsedangkan:\n\n\\[\nV' = V\n\\]\n\ntetap tidak berubah.\n\n---\n\nSekarang kamu sudah punya mental model lengkap:\n\n```text\nEmbedding\n↓\nToken punya makna tetapi belum punya urutan\n\nPositional Encoding\n↓\nMemberikan informasi urutan\n\nSinusoidal\n↓\nPosisi bisa diekstrapolasi ke panjang baru\n\nRoPE\n↓\nPosisi masuk langsung ke attention\n\nQ dan K diputar\n↓\nAttention memahami jarak relatif\n\nV tidak diputar\n↓\nMakna semantik tetap stabil\n```\n\nSebagai latihan terakhir, coba jawab satu pertanyaan yang sering muncul di diskusi LLM:\n\n> Jika RoPE bekerja dengan rotasi sinus/cosinus dan sangat bagus untuk relative position, mengapa model seperti entity[\"company\",\"Meta\",\"Llama models\"] Llama masih memerlukan teknik tambahan seperti *RoPE Scaling*, *NTK Scaling*, atau *YaRN* ketika context window diperpanjang dari 4K menjadi 128K?\n\nPetunjuk: RoPE memang bisa menghasilkan posisi berapa pun, tetapi ada sesuatu yang kualitasnya mulai rusak ketika posisi menjadi sangat besar. Apa kira-kira itu?"},{"id":"eb74877e-43fc-49a0-b819-1522b06643ca","role":"user","content":"semakin besar token yang di compute membuat metode RoPE posisi menjadi tidak skalar, 4K dan 128K token memiliki rentang yang berbeda sehingga dapat merubah arti dari attention"},{"id":"cb3a0ccb-02a0-437c-a755-dc6640e33c75","role":"assistant","content":"Ya, kamu menangkap ide besarnya.\n\nSaya akan memperhalus sedikit karena ada nuansa yang penting.\n\nBukan karena RoPE \"tidak scalable\" secara komputasi. RoPE tetap bisa menghitung posisi 128K, 1 juta, atau lebih.\n\nMasalahnya adalah **geometri posisi yang dipelajari saat training mulai berubah ketika diekstrapolasi terlalu jauh**.\n\nBayangkan model dilatih sampai 4K token.\n\nSelama training, model belajar pola seperti:\n\n```text\njarak 5 token\njarak 20 token\njarak 100 token\njarak 1000 token\n```\n\nmelalui rotasi RoPE.\n\nLalu saat inference tiba-tiba muncul:\n\n```text\njarak 50.000 token\njarak 100.000 token\n```\n\nModel belum pernah melihat pola rotasi sebesar itu.\n\nAkibatnya hubungan yang dipelajari saat training mulai mengalami **distribution shift**.\n\n---\n\nAnalogi yang sering dipakai:\n\nBayangkan kamu melatih GPS hanya untuk wilayah:\n\n```text\n0 km ───────── 4 km\n```\n\nLalu tiba-tiba kamu memintanya bernavigasi di:\n\n```text\n0 km ───────────────────────────────────────── 128 km\n```\n\nKoordinat masih bisa dihitung.\n\nTapi interpretasi koordinat tersebut belum tentu sama dengan yang dipelajari sebelumnya.\n\n---\n\nKarena RoPE menggunakan sinus/cosinus, semakin jauh posisinya maka sudut rotasinya makin besar.\n\nSecara intuitif:\n\n```text\nTraining:\n0 ──────── 4K\n\nInference:\n0 ─────────────────────────────────────────── 128K\n```\n\n\"Resolusi\" posisi yang dipelajari model menjadi tidak cocok lagi dengan rentang baru.\n\nMakanya muncul:\n\n- RoPE Scaling\n- NTK Scaling\n- YaRN\n- LongRoPE\n\nyang pada dasarnya mencoba:\n\n> \"memampatkan\" atau \"meregangkan\" ruang posisi agar posisi 128K terlihat lebih mirip distribusi posisi yang pernah dipelajari saat training.\n\n---\n\nSaya ingin cek pemahamanmu dengan satu pertanyaan.\n\nMisalkan model dilatih dengan context 4K dan memakai RoPE.\n\nSaat inference kita ingin 128K.\n\nMenurutmu mana yang lebih masuk akal:\n\nA. Mengubah bobot transformer (Q, K, V, FFN, dll).\n\natau\n\nB. Mengubah cara posisi dipetakan ke sudut rotasi RoPE.\n\nKenapa? (Satu alasan saja cukup.)"},{"id":"80820a55-04de-4ab0-878e-df117ef5fed3","role":"user","content":"Mengubah cara posisi dipetakan karena yang berubah adalah posisi dari kata ada yg lebih panjang"},{"id":"b234da44-b221-4d31-8684-f017fc7a26b9","role":"user","content":"Original custom instructions no longer available"},{"id":"ab68867e-ecda-4f33-9574-ccf9ba1c01e6","role":"assistant","content":"Ya, itu alasan yang tepat.\n\nKalau tujuan kita hanya memperpanjang context window:\n\n```text\n4K → 128K\n```\n\nmaka pengetahuan bahasa model sebenarnya tidak berubah:\n\n- grammar tidak berubah,\n- semantic understanding tidak berubah,\n- reasoning capability tidak berubah.\n\nYang berubah adalah:\n\n> bagaimana posisi direpresentasikan.\n\nKarena itu lebih masuk akal mengubah pemetaan posisi → sudut rotasi daripada mengubah seluruh bobot Transformer.\n\n---\n\nSekarang saya ingin menambahkan satu insight yang sering muncul saat membaca paper Long Context.\n\nAda perbedaan antara:\n\n1. **Context Window**\n2. **Effective Context Window**\n\nMisalnya vendor mengklaim:\n\n```text\nContext Window = 128K\n```\n\nBelum tentu:\n\n```text\nEffective Context Window = 128K\n```\n\nBisa jadi:\n\n```text\nContext Window = 128K\nEffective Context Window ≈ 20K–40K\n```\n\nkarena model mulai kehilangan kemampuan menggunakan informasi yang sangat jauh.\n\n### Coba pikirkan\n\nMisalkan ada fakta penting di token #100.\n\nLalu pertanyaan tentang fakta itu muncul di token #120.000.\n\nWalaupun RoPE Scaling berhasil membuat model menerima 128K token, menurutmu apa yang membuat model tetap kesulitan menghubungkan kedua token tersebut?\n\nPetunjuk:\n\nKita sudah membahas bahwa attention score bergantung pada Q dan K. Apa yang terjadi pada hubungan relatif ketika jaraknya menjadi puluhan atau ratusan ribu token? Coba jelaskan dengan intuisi, tidak perlu rumus."},{"id":"36119d02-59d9-44c9-a688-2ddb5aaea322","role":"user","content":"Kedua posisinya sangat jauh"},{"id":"17b80448-37ee-446e-b9cc-a5374a64b236","role":"assistant","content":"Benar. Itu inti pertama.\n\nKalau token #100 dan token #120.000 sangat jauh, maka model harus mempertahankan hubungan yang relevan di rentang yang luar biasa panjang.\n\nTetapi mari kita gali sedikit lebih dalam.\n\nBayangkan saat menghitung attention untuk token #120.000:\n\n```text\ntoken #1\ntoken #2\n...\ntoken #100\n...\ntoken #50.000\n...\ntoken #120.000\n```\n\nAda **119.999 kandidat token** yang bisa diperhatikan.\n\nPertanyaannya bukan lagi:\n\n> \"Bisakah posisi direpresentasikan?\"\n\nmelainkan:\n\n> \"Bisakah token #120.000 menemukan bahwa token #100 adalah token yang penting di antara ratusan ribu token lainnya?\"\n\n---\n\nAnalogi perpustakaan:\n\n- Pada dokumen 1 halaman, mencari satu fakta mudah.\n- Pada dokumen 1000 halaman, fakta itu masih ada.\n- Tetapi menemukan fakta yang tepat menjadi jauh lebih sulit.\n\nJadi masalah long-context bukan hanya positional encoding.\n\nMasalahnya juga:\n\n- attention menjadi semakin tersebar,\n- sinyal penting kalah oleh banyak token lain,\n- model tidak pernah dilatih melakukan retrieval pada jarak sejauh itu,\n- informasi penting dapat \"tenggelam\" di tengah konteks yang sangat panjang.\n\nInilah mengapa pada benchmark long-context sering ditemukan fenomena:\n\n> model bisa membaca 128K token tetapi performa recall informasi jauh menurun ketika informasi berada di tengah atau sangat jauh dari pertanyaan.\n\n---\n\nSaya ingin cek satu pemahaman terakhir.\n\nMisalkan ada dua model:\n\n- Model A: context window 32K, dilatih native pada 32K.\n- Model B: context window 128K, hasil RoPE scaling dari model 4K.\n\nMenurutmu mana yang kemungkinan lebih baik untuk menjawab pertanyaan tentang informasi yang berada 20K token sebelumnya? Dan kenapa? (Tidak selalu mutlak, tetapi secara umum.)"},{"id":"57ba3fba-e2c8-46e3-b1e1-72c1d6faffe5","role":"user","content":"Model A, karena dilatih untuk bisa sejauh itu"},{"id":"733c385a-482e-47a8-b17d-81ad3fba1404","role":"assistant","content":"Ya, secara umum itu jawaban yang lebih tepat.\n\n### Evaluasi Premis\n\nPremisnya:\n\n> Model yang memang dilatih pada 32K context kemungkinan lebih baik memahami dependency 20K token daripada model 4K yang hanya diperpanjang menjadi 128K dengan RoPE scaling.\n\nPremis ini umumnya benar.\n\n---\n\n### Analisis\n\nModel A selama training memang sudah melihat pola seperti:\n\n```text id=\"wmg1d3\"\njarak 1K\njarak 5K\njarak 10K\njarak 20K\njarak 30K\n```\n\nSehingga bobot attention belajar:\n\n- kapan harus memperhatikan token yang jauh,\n- bagaimana melakukan retrieval informasi jauh,\n- bagaimana menjaga informasi penting tetap relevan.\n\nSedangkan Model B:\n\n```text id=\"lj5y4t\"\nTraining : 4K\nInference: 128K\n```\n\nRoPE scaling hanya membantu representasi posisi agar tidak rusak terlalu cepat.\n\nTetapi tidak otomatis mengajarkan model:\n\n> \"bagaimana menggunakan informasi pada jarak 20K token\"\n\nkarena pengalaman training-nya tidak pernah sampai sejauh itu.\n\nIni mirip perbedaan antara:\n\n- orang yang memang berlatih lari 20 km,\n- orang yang biasa lari 4 km lalu dipaksa lari 20 km.\n\nTubuhnya masih bisa bergerak, tetapi performanya belum tentu sama.\n\n---\n\n### Kesimpulan\n\nSecara umum:\n\n> Model yang dilatih native pada 32K context biasanya akan lebih andal pada dependency 20K token dibanding model 4K yang hanya diperpanjang dengan RoPE scaling.\n\nKarena long-context bukan hanya masalah representasi posisi, tetapi juga masalah **apa yang benar-benar dipelajari selama training**.\n\n---\n\n### Tingkat Keyakinan\n\n**Tinggi**\n\nKarena ini konsisten dengan hasil berbagai penelitian long-context modern: memperbesar context window melalui RoPE scaling membantu, tetapi biasanya masih kalah dibanding model yang memang dilatih atau di-fine-tune pada panjang konteks yang sesuai.\n\nDan saya rasa sekarang kamu sudah menangkap perbedaan yang sering membingungkan banyak orang:\n\n```text\nPositional Encoding\n≠\nKemampuan Long Context\n```\n\nPositional encoding hanya memungkinkan model **mengetahui posisi**.\n\nLong-context reasoning mengharuskan model **belajar menggunakan informasi yang sangat jauh** selama training. Itu masalah yang berbeda."}];

const LESSONS = [
{id:'why-position',title:'Mengapa posisi dibutuhkan?',goal:'Melihat bahwa makna token belum membawa urutan.',summary:'Tiga kartu token dapat diurutkan ulang. Saat posisi dinyalakan, setiap kartu mendapat indeks dan panah urutan.',copy:`Transformer membaca semua token sekaligus (paralel), bukan satu per satu. Karena itu model tahu makna <em>anjing</em>, <em>menggigit</em>, dan <em>manusia</em>—tetapi tidak tahu siapa yang muncul lebih dulu. Coba tukar urutan kartu: tanpa informasi posisi, “anjing menggigit manusia” dan “manusia menggigit anjing” terlihat sama bagi model. Informasi posisilah yang memberi urutan sehingga attention bisa memakainya.`,question:'Mengapa token embedding saja tidak cukup?',options:['Transformer tidak memperoleh urutan token secara otomatis saat memprosesnya paralel.','Karena embedding tidak menyimpan makna','Karena jumlah token selalu berubah.'],answer:0,steps:['Ubah urutan token.','Bandingkan tampilan dengan dan tanpa posisi.']},
{id:'additive-encoding',title:'Menjumlahkan posisi',goal:'Memahami mengapa lebar representasi tetap.',summary:'Tiga bar menampilkan delapan dimensi token, positional vector, dan hasil penjumlahannya.',copy:`Cara klasik menyisipkan posisi: jumlahkan angka demi angka. Token embedding punya 8 angka, positional vector juga 8 angka, jadi hasilnya tetap 8 angka—bukan 16. Bayangkan mencampur dua warna cat: hasilnya satu warna baru yang membawa jejak keduanya. Setiap angka hasil adalah campuran “makna token” dan “posisi token”.`,question:'Mengapa positional vector dibuat berdimensi sama dengan token embedding?',options:['Agar keduanya dapat dijumlahkan tanpa mengubah lebar representasi.','Agar jumlah parameter selalu nol','Agar tokenizer mengenali posisi.'],answer:0,steps:['Pilih token dan posisi.','Gabungkan kedua vektor.']},
{id:'sinusoidal-lab',title:'Laboratorium sinusoidal',goal:'Mengamati frekuensi, kedekatan, dan posisi baru.',summary:'Grafik menampilkan sepasang gelombang sinus-kosinus; heatmap menunjukkan nilai posisi 0 sampai 31 pada delapan dimensi.',copy:`Positional vector klasik dibangun dari gelombang sinus-kosinus. Tiap pasangan dimensi memakai frekuensi berbeda—ada yang berubah cepat, ada yang lambat, mirip jarum detik, menit, dan jam pada arloji. Posisi yang berdekatan menghasilkan pola yang mirip; posisi jauh terlihat berbeda. Karena berupa rumus, nilai untuk posisi berapa pun bisa dihitung, termasuk yang tidak pernah dilihat saat training. Tetapi “bisa dihitung” tidak sama dengan “model terlatih memakainya”.`,question:'Apa kelebihan utama sinusoidal encoding untuk posisi baru?',options:['Nilainya dapat dihitung untuk posisi yang tidak ada di tabel learned embedding.','Model otomatis mahir reasoning pada jarak apa pun','Semua posisi menghasilkan vector yang sama.'],answer:0,steps:['Geser posisi dan pilih pasangan dimensi.','Bandingkan posisi dekat dan jauh.']},
{id:'relative-position',title:'Jarak relatif',goal:'Melihat pola yang bertahan saat dua posisi digeser bersama.',summary:'Dua marker A dan B menunjukkan posisi serta delta sebelum dan sesudah pergeseran.',copy:`Dalam bahasa, yang sering penting bukan “kata ini ada di posisi 10”, melainkan “kata ini 4 langkah setelah kata itu”. Geser slider A dan B: mengubah salah satunya mengubah jarak Δ = B − A. Lalu geser keduanya bersama—selama bergesernya sama jauh, Δ tidak berubah. Pola relatif inilah yang ingin dipertahankan encoding modern.`,question:'Jika A dan B sama-sama digeser +10, apa yang tetap?',options:['Jarak relatif B − A.','Posisi absolut keduanya','Isi token berubah.'],answer:0,steps:['Geser slider A dan B, lalu pilih pasangan dimensi.','Tekan “Geser keduanya +10” dan perhatikan Δ.']},
{id:'rope-qkv',title:'RoPE pada Q dan K',goal:'Membedakan matching dari payload semantik.',summary:'Token target membuat garis attention ke semua Key; diagram vektor menunjukkan rotasi Query dan Key, sementara Value tetap.',copy:`Saat attention, tiap token menyiapkan tiga hal: <b>Query</b> (“apa yang saya cari”), <b>Key</b> (“label kecocokan saya”), dan <b>Value</b> (“isi yang saya bawa”). RoPE menyisipkan posisi dengan memutar vektor Q dan K sesuai posisinya, seperti jarum jam. Skor kecocokan hanya bergantung pada sudut relatif Q dan K—jadi yang terekam adalah jarak antar token, bukan posisi absolut. V tidak ikut diputar karena ia hanya membawa isi setelah kecocokan dipilih.`,question:'Mengapa RoPE memutar Q dan K, tetapi tidak V?',options:['Q dan K menentukan kecocokan/attention score; V membawa isi setelah kecocokan dipilih.','V tidak memiliki dimensi','Q dan K bukan hasil learned projection.'],answer:0,steps:['Pilih token target.','Atur posisi awal dan jarak.','Geser pasangan tanpa mengubah relasi.']},
{id:'long-context',title:'Kemampuan long context',goal:'Memisahkan kapasitas posisi dari kemampuan retrieval.',summary:'Fakta berada di token 100, pertanyaan di token terakhir, dan distractor bertambah saat context window membesar.',copy:`Context window 128K artinya model dapat <em>menampung</em> 128 ribu token—bukan berarti ia dapat <em>memakai</em> semuanya dengan andal. Bagian yang benar-benar dapat diandalkan disebut effective context. RoPE scaling bisa memperluas “koordinat” posisi, tetapi menemukan satu fakta di antara ribuan distractor tetap butuh kemampuan retrieval yang dilatih. Kapasitas posisi ≠ kemampuan menggunakan.`,question:'Mana yang umumnya lebih andal untuk dependency 20K?',options:['Model A native 32K, karena dilatih melihat jarak sejauh itu.','Model B selalu, karena angka 128K lebih besar','Keduanya pasti sama selama posisi dapat direpresentasikan.'],answer:0,steps:['Ubah context window.','Bandingkan kedua model.']}
];

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function pe(pos,d=8){return Array.from({length:d},(_,j)=>{const i=Math.floor(j/2),a=pos/Math.pow(10000,2*i/d);return j%2?Math.cos(a):Math.sin(a)})}
function cosine(a,b){const dot=a.reduce((s,x,i)=>s+x*b[i],0),na=Math.hypot(...a),nb=Math.hypot(...b);return dot/(na*nb)}
function rotate([x,y],t){return[x*Math.cos(t)-y*Math.sin(t),x*Math.sin(t)+y*Math.cos(t)]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTranscriptMarkdown(source){let s=esc(source),codes=[];s=s.replace(/```([^\n]*)\n([\s\S]*?)```/g,(_,lang,body)=>`@@CODE${codes.push(`<pre><code data-language="${esc(lang.trim())}">${body}</code></pre>`)-1}@@`);s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^(?:- |\* )(.+)$/gm,'<li>$1</li>').replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\\\[([\s\S]*?)\\\]/g,'<span class="mono" aria-label="rumus">$1</span>').replace(/\\\((.*?)\\\)/g,'<span class="mono" aria-label="rumus">$1</span>').replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');codes.forEach((v,i)=>s=s.replace(`@@CODE${i}@@`,v));return s}
window.renderTranscriptMarkdown=renderTranscriptMarkdown;
function group(step,html){return `<section class="control-group" data-step="${step}">${html}</section>`}
function setHash(id){if(location.hash.slice(1)!==id)location.hash=id;else selectLesson(id)}
function selectLesson(id){if(!validLesson(id))id='why-position';state.currentLesson=id;saveState();renderLesson();}
function updateHeader(){const n=Object.keys(state.completed).length;$('#progress-label').textContent=`${n} / 6 bab selesai`;$('#progress-fill').style.width=`${n/6*100}%`;$('#progress-fill').parentElement.setAttribute('aria-valuenow',n);$('#storage-status').textContent=storageAvailable?'':'Progres tidak dapat disimpan';$('#mode').value=state.mode;$$('#lesson-nav button').forEach(b=>{b.classList.toggle('active-nav',b.dataset.lesson===state.currentLesson);b.setAttribute('aria-current',b.dataset.lesson===state.currentLesson?'step':'false')})}
function renderNav(){ $('#lesson-nav').innerHTML=LESSONS.map((l,i)=>`<button type="button" data-lesson="${l.id}" aria-label="Bab ${i+1}: ${l.title}">${i+1}</button>`).join('');$$('#lesson-nav button').forEach(b=>b.onclick=()=>{if(state.mode==='free'||state.completed[b.dataset.lesson]||b.dataset.lesson===state.currentLesson)setHash(b.dataset.lesson)})}
function applyGuidance(lesson){const groups=$$('#visual-stage .control-group'),step=state.callout[lesson.id]||0;if(state.mode==='free'){groups.forEach(g=>g.hidden=false);$('#guide-callout').hidden=true}else{groups.forEach((g,i)=>{g.hidden=i>step;g.classList.toggle('current-step',i===Math.min(step,groups.length-1))});const more=step<groups.length-1;$('#guide-callout').hidden=false;$('#guide-text').textContent=lesson.steps[Math.min(step,lesson.steps.length-1)]||'Amati perubahan visual.';$('#guide-next').hidden=!more;$('#guide-next').onclick=()=>{state.callout[lesson.id]=step+1;saveState();renderLesson()}}const idx=LESSONS.indexOf(lesson),unlocked=state.mode==='free'||!groups.length||step>=groups.length-1;$('#next-lesson').disabled=idx===LESSONS.length-1||!unlocked;$('#prev-lesson').disabled=idx===0}
function renderLesson(){const lesson=LESSONS.find(l=>l.id===state.currentLesson)||LESSONS[0],idx=LESSONS.indexOf(lesson);$('#lesson-number').textContent=`Bab ${idx+1} dari 6`;$('#lesson-title').textContent=lesson.title;$('#lesson-goal').textContent=lesson.goal;$('#lesson-narrative').innerHTML=lesson.copy;$('#visual-summary').textContent=lesson.summary;renderVisual(lesson.id);renderCheckpoint(lesson);applyGuidance(lesson);updateHeader();$('#prev-lesson').onclick=()=>idx&&setHash(LESSONS[idx-1].id);$('#next-lesson').onclick=()=>idx<5&&setHash(LESSONS[idx+1].id)}
function renderVisual(id){const f={"why-position":renderWhy,"additive-encoding":renderAdd,"sinusoidal-lab":renderSin,"relative-position":renderRelative,"rope-qkv":renderRope,"long-context":renderContext}[id];f()}
function renderWhy(){const s=visualState.why||(visualState.why={tokens:['anjing','menggigit','manusia'],show:false});$('#visual-controls').innerHTML=group(0,`<div class="controls"><button id="preset-a">anjing → menggigit → manusia</button><button id="preset-b">manusia → menggigit → anjing</button></div>`)+group(1,`<label><input id="show-pos" type="checkbox" ${s.show?'checked':''}> Tampilkan posisi</label>`);const draw=()=>{$('#visual-canvas').innerHTML=`<div class="token-row">${s.tokens.map((t,i)=>`<div class="token" draggable="true" data-i="${i}"><strong>${t}</strong>${s.show?`<span class="pos">pos ${i}</span>`:''}<span class="token-actions"><button aria-label="Geser ${t} ke kiri" data-move="-1">Geser kiri</button><button aria-label="Geser ${t} ke kanan" data-move="1">Geser kanan</button></span></div>${s.show&&i<2?'<span class="arrow" aria-hidden="true">→</span>':''}`).join('')}</div><p class="note">${s.show?'Urutan kini eksplisit melalui indeks posisi.':'Kartu hanya membawa token; urutan belum menjadi bagian representasi.'}</p>`;$$('.token button').forEach(b=>b.onclick=()=>{const card=b.closest('.token'),i=+card.dataset.i,j=i+(+b.dataset.move);if(j>=0&&j<3){[s.tokens[i],s.tokens[j]]=[s.tokens[j],s.tokens[i]];draw()}});$$('.token').forEach(card=>{card.ondragstart=e=>{e.dataTransfer.setData('text/plain',card.dataset.i);card.classList.add('dragging')};card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain'),to=+card.dataset.i;const [v]=s.tokens.splice(from,1);s.tokens.splice(to,0,v);draw()}})};draw();$('#preset-a').onclick=()=>{s.tokens=['anjing','menggigit','manusia'];draw()};$('#preset-b').onclick=()=>{s.tokens=['manusia','menggigit','anjing'];draw()};$('#show-pos').onchange=e=>{s.show=e.target.checked;draw()}}
function vectorHTML(label,v){return `<div class="vector"><div class="vector-label">${label}</div>${v.map(x=>`<div class="vector-cell" style="--mag:${x.toFixed(2)}">${x.toFixed(2)}</div>`).join('')}</div>`}
function renderAdd(){const s=visualState.add||(visualState.add={token:'saya',pos:2,joined:false});$('#visual-controls').innerHTML=group(0,`<div class="controls"><label>Token <select id="add-token">${Object.keys(EMB).map(x=>`<option ${x===s.token?'selected':''}>${x}</option>`).join('')}</select></label><label>Posisi <input id="add-pos" type="range" min="0" max="12" value="${s.pos}"> <output id="add-pos-out">${s.pos}</output></label></div>`)+group(1,`<button id="join">Gabungkan</button>`);const draw=()=>{const p=pe(s.pos),sum=EMB[s.token].map((x,i)=>x+p[i]);$('#visual-canvas').innerHTML=vectorHTML('token',EMB[s.token])+`<div class="equation">+</div>`+vectorHTML('posisi',p)+`<div class="equation">${s.joined?'↓ dijumlahkan':'siap digabung'}</div>`+vectorHTML('hasil',sum)+`<p class="note mono">8 + 8 → tetap 8 dimensi</p>`;$('#visual-canvas').classList.toggle('joined',s.joined)};draw();$('#add-token').onchange=e=>{s.token=e.target.value;draw()};$('#add-pos').oninput=e=>{s.pos=+e.target.value;$('#add-pos-out').value=s.pos;draw()};$('#join').onclick=()=>{s.joined=true;draw()}}
function pairOptions(sel){return[0,2,4,6].map(x=>`<option value="${x}" ${x===sel?'selected':''}>${x}/${x+1}</option>`).join('')}
function renderSin(){const s=visualState.sin||(visualState.sin={pos:10,pair:0,compare:[10,11]});$('#visual-controls').innerHTML=group(0,`<div class="controls"><label>Posisi <input id="sin-pos" type="range" min="0" max="128" value="${s.pos}"> <output id="sin-out">${s.pos}</output></label><label>Dimensi <select id="sin-pair">${pairOptions(s.pair)}</select></label></div>`)+group(1,`<div class="controls"><button id="near">Bandingkan 10 vs 11</button><button id="far">Bandingkan 10 vs 80</button></div>`);const draw=()=>{const W=620,H=220,pts=(dim)=>Array.from({length:129},(_,x)=>`${x/128*W},${H/2-pe(x)[dim]*82}`).join(' '),mx=s.pos/128*W;const heat=Array.from({length:32},(_,p)=>`<span class="heat-head">${p}</span>${pe(p).map(v=>`<span class="heat-cell" style="--v:${(v+1)/2}" title="${v.toFixed(3)}"></span>`).join('')}`).join('');const sim=cosine(pe(s.compare[0]),pe(s.compare[1]));$('#visual-canvas').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gelombang dimensi ${s.pair} dan ${s.pair+1}, marker posisi ${s.pos}"><line class="axis" x1="0" y1="${H/2}" x2="${W}" y2="${H/2}"/><polyline class="wave-a" points="${pts(s.pair)}"/><polyline class="wave-b" points="${pts(s.pair+1)}"/><line class="marker" x1="${mx}" y1="0" x2="${mx}" y2="${H}"/></svg><p class="metric">cosine similarity PE(${s.compare[0]}), PE(${s.compare[1]}) = <strong>${sim.toFixed(4)}</strong></p><div class="heatmap"><span></span>${Array.from({length:8},(_,i)=>`<b class="heat-head">d${i}</b>`).join('')}${heat}</div><p class="note">Heatmap berhenti di 31; marker tetap dapat bergerak hingga 128. Posisi baru dapat dihitung, bukan otomatis dipahami model.</p>`};draw();$('#sin-pos').oninput=e=>{s.pos=+e.target.value;$('#sin-out').value=s.pos;draw()};$('#sin-pair').onchange=e=>{s.pair=+e.target.value;draw()};$('#near').onclick=()=>{s.compare=[10,11];draw()};$('#far').onclick=()=>{s.compare=[10,80];draw()}}
function renderRelative(){const s=visualState.rel||(visualState.rel={a:10,b:14,pair:0,before:null});$('#visual-controls').innerHTML=group(0,`<div class="controls"><label>Posisi A <input id="rel-a" type="range" min="0" max="128" value="${s.a}"> <output id="rel-a-out">${s.a}</output></label><label>Posisi B <input id="rel-b" type="range" min="0" max="128" value="${s.b}"> <output id="rel-b-out">${s.b}</output></label><label>Dimensi <select id="rel-pair">${pairOptions(s.pair)}</select></label></div>`)+group(1,`<button id="shift-both">Geser keduanya +10</button>`);const draw=()=>{const delta=s.b-s.a,phase=delta/Math.pow(10000,s.pair/8),line=(a,b,label)=>`<div><strong>${label}</strong><div class="relative-line"><span class="pin-label" style="left:${a/128*100}%">A ${a}</span><span class="pin" style="left:${a/128*100}%"></span><span class="pin-label" style="left:${b/128*100}%">B ${b}</span><span class="pin b" style="left:${b/128*100}%"></span></div></div>`;$('#visual-canvas').innerHTML=`<p class="metric">Δ = B − A = <strong>${delta}</strong> · fase relatif d${s.pair}/${s.pair+1} = ${phase.toFixed(3)}</p>${s.before?line(s.before.a,s.before.b,'Sebelum'):''}${line(s.a,s.b,s.before?'Sesudah':'Saat ini')}${s.before?`<p class="note">Keduanya bergeser sama jauh — Δ tetap <strong>${delta}</strong> ✓</p>`:''}`;$('#shift-both').disabled=Math.max(s.a,s.b)>118};draw();$('#rel-a').oninput=e=>{s.before=null;s.a=+e.target.value;$('#rel-a-out').value=s.a;draw()};$('#rel-b').oninput=e=>{s.before=null;s.b=+e.target.value;$('#rel-b-out').value=s.b;draw()};$('#rel-pair').onchange=e=>{s.pair=+e.target.value;draw()};$('#shift-both').onclick=()=>{s.before={a:s.a,b:s.b};s.a+=10;s.b+=10;$('#rel-a').value=s.a;$('#rel-a-out').value=s.a;$('#rel-b').value=s.b;$('#rel-b-out').value=s.b;draw()}}
function renderRope(){const toks=['tidak','terlalu','bagus'],s=visualState.rope||(visualState.rope={target:1,pos:2,gap:3,basePos:2});$('#visual-controls').innerHTML=group(0,`<div class="controls" role="group" aria-label="Pilih token target">${toks.map((t,i)=>`<button data-target="${i}" class="${i===s.target?'active-nav':''}">${t}</button>`).join('')}</div>`)+group(1,`<div class="controls"><label>Posisi awal <input id="rope-pos" type="range" min="0" max="20" value="${Math.min(s.pos,20)}"> <output id="rope-pos-out">${s.pos}</output></label><label>Jarak <input id="rope-gap" type="range" min="1" max="20" value="${s.gap}"> <output id="rope-gap-out">${s.gap}</output></label></div>`)+group(2,`<button id="rope-shift">Geser pasangan +5</button>`);const draw=()=>{const q=[.9,.4],k=[.7,.6],qR=rotate(q,s.pos*.22),kR=rotate(k,(s.pos+s.gap)*.22),dot=qR[0]*kR[0]+qR[1]*kR[1],scores=toks.map((_,i)=>Math.max(.12,1-Math.abs(i-s.target)*.28));$('#visual-canvas').innerHTML=`<div class="note"><b class="q">Q</b> = apa yang dicari · <b class="k">K</b> = label kecocokan · <b class="v">V</b> = isi yang diambil</div>${toks.map((t,i)=>`<div class="attention-row"><strong>${i===s.target?'Q → ':''}${t}</strong><span class="attention-bar" style="transform:scaleX(${scores[i]})"></span></div>`).join('')}<div class="equation mono">rotate([x,y], θ)=[x cosθ−y sinθ, x sinθ+y cosθ]</div><p class="metric"><span class="q">Q pos ${s.pos}</span> · <span class="k">K pos ${s.pos+s.gap}</span> · sudut relatif ${(s.gap*.22).toFixed(2)} rad · Q·K = <strong>${dot.toFixed(3)}</strong></p><p class="mono">Q′=[${qR.map(x=>x.toFixed(3))}] · K′=[${kR.map(x=>x.toFixed(3))}]</p><article class="model-card"><b class="v">V tetap</b><br>isi token “${toks[s.target]}” — tidak diputar atau berpindah</article>`;$('#rope-shift').disabled=s.pos+s.gap+5>40};draw();$$('[data-target]').forEach(b=>b.onclick=()=>{s.target=+b.dataset.target;renderRope();applyGuidance(LESSONS[4])});$('#rope-pos').oninput=e=>{s.pos=+e.target.value;$('#rope-pos-out').value=s.pos;draw()};$('#rope-gap').oninput=e=>{s.gap=+e.target.value;$('#rope-gap-out').value=s.gap;draw()};$('#rope-shift').onclick=()=>{s.pos+=5;draw()}}
function renderContext(){const vals=[4,8,16,32,64,128],s=visualState.ctx||(visualState.ctx={idx:2,model:'A'});$('#visual-controls').innerHTML=group(0,`<label>Context window <input id="ctx" type="range" min="0" max="5" step="1" value="${s.idx}"> <output id="ctx-out">${vals[s.idx]}K</output></label>`)+group(1,`<div class="model-grid"><button class="model-card" data-model="A">Model A — native 32K</button><button class="model-card" data-model="B">Model B — trained 4K, RoPE-scaled 128K</button></div>`);const draw=()=>{const n=8+s.idx*7,tokens=Array.from({length:n},(_,i)=>`<span class="context-token ${i===0?'fact':i===n-1?'question':'distractor'}" title="${i===0?'Fakta token #100':i===n-1?'Pertanyaan token terakhir':'Distractor'}"></span>`).join('');$('#visual-canvas').innerHTML=`<div class="context-strip" aria-label="Fakta di token 100, ${n-2} kelompok distractor, pertanyaan di token terakhir">${tokens}</div><p class="metric">Fakta: token #100 · Pertanyaan: token #${vals[s.idx]}K · distractor visual: ${n-2}</p><p class="note">Dependency 20K: <strong>${s.model==='A'?'Model A lebih mungkin andal':'Model B dapat menerima panjangnya, tetapi scaling tidak membuktikan retrieval andal'}</strong>. ${s.model==='A'?'Native training telah melihat jarak tersebut.':'Kapasitas posisi ≠ effective context.'}</p>`;$$('[data-model]').forEach(b=>b.classList.toggle('selected',b.dataset.model===s.model))};draw();$('#ctx').oninput=e=>{s.idx=+e.target.value;$('#ctx-out').value=`${vals[s.idx]}K`;draw()};$$('[data-model]').forEach(b=>b.onclick=()=>{s.model=b.dataset.model;draw()})}
function renderCheckpoint(l){const completed=!!state.completed[l.id];$('#checkpoint').innerHTML=`<h2>Checkpoint</h2><fieldset><legend>${l.question}</legend>${l.options.map((o,i)=>`<label class="option"><input type="radio" name="quiz" value="${i}"> <span>${o}</span></label>`).join('')}</fieldset><button id="check-answer">Periksa jawaban</button><p id="quiz-feedback" class="feedback ${completed?'correct':''}" aria-live="polite">${completed?'Bab ini sudah selesai.':''}</p>`;$('#check-answer').onclick=()=>{const chosen=$('input[name=quiz]:checked'),out=$('#quiz-feedback');if(!chosen){out.textContent='Pilih satu jawaban terlebih dahulu.';out.className='feedback incorrect';return}if(+chosen.value===l.answer){state.completed[l.id]=true;saveState();out.textContent='Benar! Bab ditandai selesai.';out.className='feedback correct'}else{out.textContent='Belum tepat. Amati lagi visual di sebelah kiri, lalu coba pilihan lain.';out.className='feedback incorrect'}}}
function renderTranscript(){const role=$('input[name=role-filter]:checked')?.value||'all',q=$('#transcript-search').value.trim().toLocaleLowerCase('id'),visible=[];$('#transcript-list').innerHTML=TRANSCRIPT.map((m,i)=>{const matchRole=role==='all'||m.role===role,hay=`${m.role}\n${m.content}`.toLocaleLowerCase('id'),match=matchRole&&(!q||hay.includes(q));if(match)visible.push(i);if(!match)return'';let html=renderTranscriptMarkdown(m.content);if(q){const safe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');html=html.replace(new RegExp(`(${safe})`,'gi'),'<mark>$1</mark>')}return `<details class="transcript-item" data-index="${i}" ${q?'open':''}><summary><span class="role-${m.role}">${i+1}. ${m.role==='assistant'?'ChatGPT':m.role==='user'?'Pengguna':'Tool notice'}</span></summary><div class="message">${html}</div></details>`}).join('');$('#search-count').textContent=`${visible.length} hasil`;$('#next-result').disabled=!visible.length;$('#next-result').onclick=()=>{const items=$$('#transcript-list details');if(!items.length)return;const active=items.findIndex(x=>x===document.activeElement.closest?.('details')),next=items[(active+1)%items.length];next.open=true;next.querySelector('summary').focus();next.scrollIntoView({block:'center'})}}
function initTranscript(){renderTranscript();$('#transcript-search').oninput=renderTranscript;$$('input[name=role-filter]').forEach(r=>r.onchange=renderTranscript);$('#open-transcript').onclick=()=>{$('#transcript-dialog').showModal();$('#transcript-search').focus()};$('#close-transcript').onclick=()=>{$('#transcript-dialog').close();$('#open-transcript').focus()};$('#transcript-dialog').addEventListener('cancel',()=>setTimeout(()=>$('#open-transcript').focus()))}
function init(){renderNav();$('#mode').onchange=e=>{state.mode=e.target.value;saveState();renderLesson()};$('#reset').onclick=()=>{if(confirm('Hapus seluruh progres belajar?')){try{localStorage.removeItem(STORE_KEY)}catch(e){storageAvailable=false}state=structuredClone(DEFAULT_STATE);visualState={};if($('#transcript-dialog').open)$('#transcript-dialog').close();location.hash='why-position';renderLesson();$('#reset').focus()}};initTranscript();window.addEventListener('hashchange',()=>selectLesson(validLesson(location.hash.slice(1))?location.hash.slice(1):'why-position'));window.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.altKey||e.metaKey||e.ctrlKey)return;const a=document.activeElement;if(a&&(/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)||a.closest('dialog')))return;const i=LESSONS.findIndex(l=>l.id===state.currentLesson),n=e.key==='ArrowLeft'?i-1:i+1;if(n>=0&&n<6){e.preventDefault();setHash(LESSONS[n].id)}});const hash=location.hash.slice(1);if(validLesson(hash))state.currentLesson=hash;else if(hash)history.replaceState(null,'','#why-position');renderLesson()}
init();
</script></body></html>
