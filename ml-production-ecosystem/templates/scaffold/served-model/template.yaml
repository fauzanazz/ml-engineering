name: served-model
version: 1
contract:
  required_variables:
    - project_name
    - package_name
    - preset
  entrypoints:
    serve: uv run serve
    test: uv run pytest
    build: uv build
    docker_build: docker build -t {{package_name}} .
  generated_paths:
    - README.md
    - pyproject.toml
    - configs/project.yaml
    - data/README.md
    - docs/runbook.md
    - tests/test_scaffold.py
    - Dockerfile
    - "{{package_name}}/api.py"
    - "{{package_name}}/predict.py"
